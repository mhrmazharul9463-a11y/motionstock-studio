<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
/* v7.0 modern UI — brand is the logo orange (#FFD117 → #FD5A03 → #EA3D02) on black.
   --blue/--cyan keep their names so the 56 var() usages update, but now hold orange values. */
:root{
  --bg0:#000000; --bg:#0b0908; --bg2:#171210;
  --card:rgba(28,20,14,.72); --card2:rgba(38,26,16,.85);
  --blue:#ea3d02; --blue2:#fd5a03; --cyan:#ff9f1c; --cyan2:#ea3d02;
  --gold:#ffd117; --gold2:#ffcf3d;
  --grad:linear-gradient(135deg,#ffd117 0%,#fd5a03 55%,#ea3d02 100%);
  --ink:#fff7ed; --muted:#c9b8a3; --line:#3a2c1e; --danger:#f87171; --ok:#34d399;
  --shadow:0 12px 40px rgba(0,0,0,.5);
}
/* v7.0 light theme — warm white/cream, same orange brand. Toggled by the header button, saved in localStorage (ms_theme). */
[data-theme="light"]{
  --bg0:#fff7ed; --bg:#fffaf3; --bg2:#ffedd5;
  --card:rgba(255,255,255,.88); --card2:rgba(255,247,237,.95);
  --blue:#ea3d02; --blue2:#fd5a03; --cyan:#e8590c; --cyan2:#ea3d02;
  --gold:#ffd117; --gold2:#ffcf3d;
  --ink:#1c1410; --muted:#7a6a58; --line:#e8d5bf;
  --shadow:0 12px 32px rgba(234,61,2,.14);
}
/* v7.0 light-theme overrides for elements with hardcoded dark colours. */
[data-theme="light"] body{background:radial-gradient(1100px 600px at 85% -10%,#ffe8cc 0%,transparent 55%),radial-gradient(900px 500px at -10% 10%,#ffd9a8 0%,transparent 50%),linear-gradient(180deg,#fffaf3,#fff1e0 70%)}
[data-theme="light"] header{background:rgba(255,250,243,.88)}
[data-theme="light"] input,[data-theme="light"] select,[data-theme="light"] textarea{background:#fff}
[data-theme="light"] .card h2,[data-theme="light"] .stat b,[data-theme="light"] .feature h3,[data-theme="light"] .plan .price{color:var(--ink)}
[data-theme="light"] .profileMenu,[data-theme="light"] .profileModal .card{background:#fffaf3}
[data-theme="light"] .heroBadge{background:rgba(253,90,3,.12);border-color:rgba(253,90,3,.4);color:#c2410c}
[data-theme="light"] .demo{background:rgba(253,90,3,.08);color:#7c2d12}
[data-theme="light"] button.ghost{background:rgba(0,0,0,.04)}
[data-theme="light"] .tab{background:rgba(0,0,0,.04)}
[data-theme="light"] .histItem{background:rgba(0,0,0,.03)}
[data-theme="light"] .pmItem:hover{background:rgba(253,90,3,.08)}
[data-theme="light"] .profileMenu{border-color:rgba(0,0,0,.12)}
[data-theme="light"] .notice{background:linear-gradient(90deg,#ffedd5,#fdba74);border-color:#ea580c}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(1100px 600px at 85% -10%,#7c2d12 0%,transparent 55%),radial-gradient(900px 500px at -10% 10%,#9a3412 0%,transparent 50%),linear-gradient(180deg,#0b0908,#000000 70%);background-attachment:fixed;min-height:100vh}
a{color:var(--cyan)}
header{position:sticky;top:0;z-index:20;background:rgba(12,8,5,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1680px;margin:0 auto;padding:0 16px}
.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;letter-spacing:.3px}
.brandLogo{width:38px;height:38px;border-radius:10px;box-shadow:0 0 14px rgba(253,90,3,.55);flex:0 0 auto}
.brandText{color:var(--ink)}
.brandText b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brandStudio{font-size:12px;letter-spacing:4px;color:var(--muted);font-weight:700}
.themeBtn{padding:8px 10px;margin:0;border-radius:10px}
.themeBtn svg{width:20px;height:20px;display:block}
.themeBtn .iconMoon{display:none}
[data-theme="light"] .themeBtn .iconSun{display:none}
[data-theme="light"] .themeBtn .iconMoon{display:block}
.ico{width:1.15em;height:1.15em;vertical-align:-.18em}
.feature .ic .ico{width:30px;height:30px;vertical-align:middle}
.heroLogo{width:96px;height:96px;border-radius:24px;box-shadow:0 0 32px rgba(253,90,3,.5),0 12px 32px rgba(0,0,0,.45);margin-bottom:10px}
nav a{color:var(--ink);text-decoration:none;margin:0 8px;font-weight:600}
nav a:hover{color:var(--cyan)}
.ticker{background:var(--grad);color:#fff;font-weight:700;overflow:hidden;white-space:nowrap;padding:6px 0}
.ticker span{display:inline-block;padding-left:100%;animation:tick 22s linear infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.notice{background:linear-gradient(90deg,#fde68a,#fbbf24);border:1px solid #d97706;border-radius:10px;padding:12px 16px;margin:14px 0;color:#451a03;font-weight:700;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0;box-shadow:var(--shadow);animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card h2{margin:0 0 10px;font-size:19px;color:#fff}
.card h2 .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h3{margin:14px 0 6px;font-size:16px;color:var(--cyan)}
label{display:block;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#1a120a;color:var(--ink);font:14px/1.5 system-ui}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue2);border-color:var(--blue2)}
textarea{font-family:ui-monospace,Consolas,monospace}
button{padding:11px 18px;border:0;border-radius:12px;background:var(--blue2);color:#fff;font-weight:700;cursor:pointer;margin:6px 6px 0 0;transition:transform .15s ease,box-shadow .15s ease,filter .15s ease}
button:hover{transform:translateY(-1px);filter:brightness(1.08)}
button:active{transform:translateY(0) scale(.98)}
button.gold,button.grad{background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(253,90,3,.45)}
button.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink)}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:160px}
.muted{color:var(--muted);font-size:13px}
#authMsg.msgErr{background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.55);color:#fca5a5;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13.5px}
#authMsg.msgOk{background:rgba(34,197,94,.13);border:1px solid rgba(34,197,94,.5);color:#86efac;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.pwWrap{position:relative}
.pwWrap input{padding-right:42px}
.pwToggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);cursor:pointer;line-height:1;padding:4px 6px;margin:0;display:flex;align-items:center}
.pwToggle svg{display:block}
.pwToggle:hover{transform:translateY(-50%);filter:none;color:var(--ink)}
.pill{display:inline-block;background:rgba(253,138,30,.14);border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin:2px;font-size:12.5px}
.pill.pro{background:var(--grad);color:#fff;border-color:transparent;font-weight:700}
/* Profile menu (v6.13): avatar button + dropdown in the header, settings modal */
#authBox{position:relative}
.avatarBtn{width:40px;height:40px;border-radius:50%;border:2px solid var(--cyan);background:var(--grad);color:#fff;font-weight:800;font-size:17px;cursor:pointer;overflow:hidden;padding:0;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.avatarBtn img{width:100%;height:100%;object-fit:cover;display:block}
.avatarBtn .avatarIcon{width:22px;height:22px}
.profileMenu{position:absolute;right:0;top:48px;width:240px;background:#1a120a;backdrop-filter:blur(28px) saturate(1.2);-webkit-backdrop-filter:blur(28px) saturate(1.2);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:8px;box-shadow:0 12px 32px rgba(0,0,0,.6);z-index:50}
.profileMenu .pmHead{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.profileMenu .pmHead b{display:block;font-size:15px}
.profileMenu .pmHead span{display:block;font-size:12.5px;color:var(--muted);word-break:break-all}
.pmItem{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;font-weight:600;padding:10px 12px;border-radius:10px;cursor:pointer}
.pmItem:hover{background:rgba(255,255,255,.07)}
.profileModal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.profileModal .card{max-width:420px;width:100%;margin:0;background:#1a120a}
.profileAvatar{width:96px;height:96px;border-radius:50%;border:3px solid var(--cyan);background:var(--grad);color:#fff;font-weight:800;font-size:38px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:0 auto}
.profileAvatar img{width:100%;height:100%;object-fit:cover;display:block}
.profileAvatar .avatarIcon{width:48px;height:48px}
/* Disabled buttons look clearly inactive (v6.14: Generate Motion is disabled until an image is loaded). */
button:disabled{opacity:.45;cursor:not-allowed}
.planGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.plan{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:16px;transition:transform .15s ease,border-color .15s ease}
.plan:hover{transform:translateY(-2px);border-color:var(--blue2)}
.plan.pop{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 10px 26px rgba(253,138,30,.18)}
.plan .price{font-size:26px;font-weight:800;color:#fff}
.plan .price small{font-size:14px;color:var(--cyan)}
.previewWrap{position:relative;width:100%;margin:8px auto;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#000}
iframe.preview{position:absolute;left:0;top:0;display:block;border:0;background:#fff}
#bokehOv{position:absolute;left:0;top:0;pointer-events:none;opacity:0}
video{width:100%;border-radius:10px;background:#000}
progress{width:100%;height:12px;appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.12);border-radius:999px}
progress::-webkit-progress-bar{background:rgba(255,255,255,.12);border-radius:999px}
progress::-webkit-progress-value{background:var(--grad);border-radius:999px}
progress::-moz-progress-bar{background:var(--grad);border-radius:999px}
.hidden{display:none!important}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{border:1px solid var(--line);padding:6px;text-align:left}
footer{color:var(--muted);text-align:center;padding:24px 10px 40px;font-size:13px}
.demo{background:rgba(253,138,30,.12);border:1px solid var(--line);color:#ffe7d1;border-radius:10px;padding:10px 14px;margin:14px 0}
/* hero + auth landing */
.hero{text-align:center;padding:44px 16px 10px;animation:fadeUp .6s ease both}
.heroBadge{display:inline-block;padding:6px 14px;border-radius:999px;background:rgba(253,138,30,.14);border:1px solid rgba(253,138,30,.45);color:#ffd9a8;font-weight:700;font-size:13px;letter-spacing:.4px}
.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.15;margin:16px 0 10px;font-weight:800}
.hero h1 .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);max-width:640px;margin:0 auto;font-size:16px}
.heroCtas{margin-top:18px}
.statRow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 18px;text-align:center}
.stat b{display:block;font-size:20px;color:#fff}
.stat span{font-size:12px;color:var(--muted)}
.authGrid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:start}
@media(max-width:760px){.authGrid{grid-template-columns:1fr}}
/* v7.0 mobile header: row 1 = logo (left) + theme toggle + profile (right);
   row 2 = nav links centred. Keeps the desktop alignment (logo left, nav
   centre, controls right) instead of letting the bar wrap awkwardly. */
@media(max-width:760px){
  .brand{font-size:20px;gap:8px}
  .brandLogo{width:32px;height:32px;border-radius:8px}
  .brandStudio{font-size:10px;letter-spacing:3px}
  .topbar nav{order:3;flex-basis:100%;display:flex;justify-content:center;flex-wrap:wrap;gap:2px 6px}
  .topbar nav a{font-size:14px;padding:4px 6px}
}
/* studio layout (v6.9 Motion Hero style): AI sidebar left, main work area right (preview top, code, edit, export) */
.studioRow{display:flex;gap:16px;align-items:flex-start;margin-top:8px}
#aiSidebar{width:360px;flex:0 0 360px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px}
#studioMain{flex:1;min-width:0}
.studioRow.hideSidebar #aiSidebar{display:none}
#aiSidebar h3{margin-top:4px}
#aiSidebar h3:first-child{margin-top:0}
.histItem{display:block;width:100%;text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 10px;margin:6px 0 0;font-weight:600;font-size:13px;cursor:pointer}
.histItem:hover{border-color:var(--blue2)}
.histItem.cur{border-color:var(--cyan);background:rgba(253,138,30,.12)}
.histItem small{display:block;font-weight:400;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Image to Animation (v6.11): drop zone + thumbnail */
#imgDrop{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;font-size:13px}
#imgDrop.over{border-color:var(--cyan);background:rgba(253,138,30,.08);color:var(--ink)}
#imgThumb{max-width:100%;max-height:150px;border-radius:10px;display:block;margin:8px auto 0}
@media(max-width:900px){.studioRow{flex-direction:column}.studioRow #aiSidebar{width:100%;flex:1 1 auto}}
/* v6.9 Motion Hero style: main work area is a vertical stack (preview, code, edit, export) */
.mhSection{margin-top:16px}
/* code editor never collapses to a thin strip (v6.6) */
#src{min-height:220px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:10px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink);font-weight:700;cursor:pointer;text-align:center}
.tab.active{background:var(--grad);border-color:transparent;color:#fff}
.featureGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.feature{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:16px}
.feature .ic{font-size:26px}
.feature h3{margin:8px 0 4px;color:#fff}
.faqItem{border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
.faqItem summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none}
.faqItem summary::-webkit-details-marker{display:none}
.faqItem div{padding:0 14px 12px;color:var(--muted)}
input[type=range]{padding:0;accent-color:var(--cyan)}
.editGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 16px}
input[type=color]{padding:2px;height:40px;cursor:pointer}
.comingSoon{padding:14px;border-radius:12px;background:linear-gradient(135deg,rgba(253,90,3,.18),rgba(253,138,30,.12));border:1px dashed var(--cyan);font-weight:700;color:var(--cyan)}
.badge95{display:inline-block;margin-top:10px;padding:6px 12px;border-radius:999px;background:var(--grad);color:#fff;font-weight:800;box-shadow:0 8px 22px rgba(253,90,3,.45);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 8px 22px rgba(253,90,3,.45)}50%{box-shadow:0 8px 30px rgba(253,138,30,.65)}}
</style></head>
