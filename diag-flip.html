function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

async function captureFrame(win, W, H) {
  const doc = win.document;
  try { doc.getAnimations().forEach((a) => { try { a.pause(); } catch (e) {} }); } catch (e) {}
  const clone = doc.cloneNode(true);
  try {
    const origEls = [doc.documentElement, ...doc.querySelectorAll("*")];
    const cloneEls = [clone.documentElement, ...clone.querySelectorAll("*")];
    for (let i = 0; i < cloneEls.length && i < origEls.length; i++) {
      try {
        const cs = win.getComputedStyle(origEls[i]);
        const el = cloneEls[i];
        el.setAttribute("style", cs.cssText);
        // Chrome-e getComputedStyle().cssText khali thake — tai animation-e
        // bodle jawa property (transform, opacity ityadi) alada kore copy
        // korte hoy; nahole clone-e flip-er majher obostha kokhono ashe na,
        // sudhu static span dekha jay.
        const liveProps = ["transform", "opacity", "filter", "translate", "rotate", "scale"];
        for (const p of liveProps) {
          try {
            const v = cs.getPropertyValue(p);
            if (v && v !== "none" && !(p === "opacity" && v === "1")) el.style.setProperty(p, v, "important");
          } catch (e) {}
        }
        // Clone-ta static snapshot: animation/transition ekhane abar
        // cholte deya jabe na — nahole SVG image-e animation-ta 0 theke
        // abar shuru hoye uporer matrix3d transform-ke dhেকে dey, ar
        // flip-er moto mid-animation frame kokhono dekha jay na.
        el.style.setProperty("animation", "none", "important");
        el.style.setProperty("transition", "none", "important");
      } catch (e) {}
    }
  } catch (e) {}
  clone.querySelectorAll("canvas").forEach((c) => {
    try { const img = clone.createElement("img"); img.setAttribute("src", c.toDataURL("image/png")); img.setAttribute("width", c.width); img.setAttribute("height", c.height); c.replaceWith(img); } catch (e) {}
  });
  clone.querySelectorAll("script").forEach((s) => s.remove());
  const styles = Array.from(clone.querySelectorAll("style")).map((s) => s.textContent).join("\n");
  const bodyXml = clone.body ? new XMLSerializer().serializeToString(clone.body) : "";
  const inner = '<div xmlns="http://www.w3.org/1999/xhtml" style="width:' + W + 'px;height:' + H + 'px;margin:0;padding:0;overflow:hidden"><style>' + styles + '</style>' + bodyXml + '</div>';
  const fullDoc = new XMLSerializer().serializeToString(clone);
  const svgs = [
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '"><foreignObject width="100%" height="100%">' + inner + "</foreignObject></svg>",
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '"><foreignObject width="100%" height="100%">' + fullDoc + "</foreignObject></svg>"
  ];
  const img = new Image();
  let loaded = false;
  for (const svg of svgs) {
    const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    try {
      await new Promise((res, rej) => {
        const to = setTimeout(() => rej(new Error("timeout")), 8000);
        img.onload = () => { clearTimeout(to); res(); };
        img.onerror = () => { clearTimeout(to); rej(new Error("load error")); };
        img.src = url;
      });
      loaded = true; break;
    } catch (e) {}
  }
  if (!loaded) throw new Error("Frame-er chobi load hoyni (SVG foreignObject)");
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d"); ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(img, 0, 0, W, H);
  return createImageBitmap(cv);
}

  out.push("flipper divs in DOM: " + win.document.querySelectorAll(".flipper").length);
  const ft = win.document.querySelector(".flip-top");
  const fb = win.document.querySelector(".flip-bottom");
  if (ft) out.push("flip-top computed transform: " + win.getComputedStyle(ft).transform);
  if (fb) out.push("flip-bottom computed transform: " + win.getComputedStyle(fb).transform);
  if (ft) out.push("flip-top computed animation: " + win.getComputedStyle(ft).animation);
  if (ft) out.push("flip-top inline style after clone-fix would be animation:none — check captured canvas below");

  // clone-style check: replicate captureFrame's style-copy for the flippers
  try {
    const cdoc = win.document.cloneNode(true);
    const oEls = [win.document.documentElement, ...win.document.querySelectorAll("*")];
    const cEls = [cdoc.documentElement, ...cdoc.querySelectorAll("*")];
    for (let i = 0; i < cEls.length && i < oEls.length; i++) {
      try {
        const cs = win.getComputedStyle(oEls[i]);
        const el = cEls[i];
        el.setAttribute("style", cs.cssText);
        const liveProps = ["transform", "opacity", "filter", "translate", "rotate", "scale"];
        for (const p of liveProps) {
          try {
            const v = cs.getPropertyValue(p);
            if (v && v !== "none" && !(p === "opacity" && v === "1")) el.style.setProperty(p, v, "important");
          } catch (e) {}
        }
        el.style.setProperty("animation", "none", "important");
        el.style.setProperty("transition", "none", "important");
      } catch (e) {}
    }
    const cft = cdoc.querySelector(".flip-top");
    const cfb = cdoc.querySelector(".flip-bottom");
    if (cft) out.push("CLONE flip-top style: " + cft.getAttribute("style"));
    if (cfb) out.push("CLONE flip-bottom style: " + cfb.getAttribute("style"));
  } catch (e) { out.push("clone check error: " + e.message); }
  const tops = win.document.querySelectorAll(".card .top span");
  const bots = win.document.querySelectorAll(".card .bottom span");
  out.push("static top spans: " + Array.from(tops).map((s) => s.textContent).join(""));
  out.push("static bottom spans: " + Array.from(bots).map((s) => s.textContent).join(""));
  dbg.textContent = out.join("\n");
  try {
    const bmp = await captureFrame(win, W, H);
    const cv = document.getElementById("cv");
    const ctx = cv.getContext("2d");
    ctx.drawImage(bmp, 0, 0, 640, 360);
    dbg.textContent += "\ncaptureFrame: OK, bitmap " + bmp.width + "x" + bmp.height;
  } catch (e) {
    dbg.textContent += "\ncaptureFrame FAILED: " + e.message;
  }
}
main();
</script>
</body>
</html>
